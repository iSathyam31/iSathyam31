<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#2a1458"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6e40c9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6e40c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>

  <circle cx="170" cy="60" r="110" fill="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="190" r="120" fill="url(#glow)">
    <animate attributeName="r" values="120;90;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
  </g>

  <text x="500" y="112" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#title)">Sathyam A</text>
  <text x="500" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#a78bfa" letter-spacing="3">AI / ML &amp; GENAI ENGINEER</text>
  <text x="500" y="188" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#8b949e">RAG  ·  Agentic AI  ·  LLM Systems</text>
</svg>
